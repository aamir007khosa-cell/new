<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>License Generator (PRIVATE)</title>
<style>
body{margin:0;background:#0a0b0c;color:#f4f6f5;font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.w{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.c{background:#141617;border:1px solid #24282b;border-radius:24px;padding:18px;margin-bottom:14px;contain:paint;animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.c:nth-of-type(2){animation-delay:.05s}.c:nth-of-type(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 10px;font-weight:800;letter-spacing:-.2px}
.w>h2{font-size:22px;display:flex;align-items:center;gap:10px}
.w>h2::before{content:"🔑";width:44px;height:44px;border-radius:50%;background:#c8f135;display:grid;place-items:center;font-size:20px}
label{display:block;color:#8b9290;font-size:12px;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;background:#1c1f21;border:1px solid transparent;color:#f4f6f5;border-radius:16px;padding:13px 14px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#c8f135}
textarea{height:90px;font-size:12px;margin-top:10px}
button{font-family:inherit;background:#c8f135;color:#0a0b0c;border:none;border-radius:999px;padding:15px;font-weight:800;font-size:16px;width:100%;margin-top:12px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button.s{background:#1c1f21;color:#f4f6f5;border:1px solid #24282b;width:auto;padding:8px 14px;font-size:13px;font-weight:700;margin:8px 6px 0 0}
.warn{color:#8b9290;font-size:13px}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.cl{border-top:1px solid #24282b;padding:12px 2px}
.cl .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cl .n{font-weight:800}.cl .m{color:#8b9290;font-size:12.5px;margin-top:2px}
.ok{color:#0a0b0c;background:#c8f135;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.bad{color:#ff6b6b;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #ff6b6b}
.soon{color:#fbbf24;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #fbbf24}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:#1c1f21;border-radius:18px;padding:12px 8px;text-align:center;font-size:11.5px;color:#8b9290;font-weight:600}
.sum div:first-child{background:linear-gradient(135deg,#d9ff4f,#9fd61c);color:rgba(10,11,12,.65)}
.sum div:first-child b{color:#0a0b0c}
.sum b{display:block;font-size:26px;font-weight:900;color:#f4f6f5;letter-spacing:-.5px}
#msg{color:#c8f135!important}
</style></head><body><div class="w">
<h2>License Generator</h2>
<p class="warn">⚠️ Sirf aap ke liye — License Generator app ke andar hi chalta hai.</p>
<div class="c">
  <div class="row">
    <div><label>Customer ka naam</label><input id="name" placeholder="jaise Ali Faisalabad"></div>
    <div><label>Device Code</label><input id="dev" placeholder="K7PQ2MXA" style="text-transform:uppercase"></div>
  </div>
  <div class="row">
    <div><label>Package</label>
      <select id="pkg"><option value="1">1 din · 1,000</option><option value="30">30 din · 20,000</option></select></div>
    <div><label>Ya apne din (optional)</label><input id="custom" type="number" placeholder="jaise 7"></div>
  </div>
  <button onclick="gen()">Key banao</button>
  <p id="msg" style="color:#3ecf7a;font-size:13px"></p>
  <textarea id="out" readonly placeholder="Key yahan aayegi"></textarea>
  <button class="s" onclick="cp(document.getElementById('out').value)">📋 Key copy karo</button>
</div>
<div class="c">
  <h2>👥 Customers</h2>
  <div class="sum"><div><b id="nAct">0</b>Chal rahe</div><div><b id="nSoon">0</b>24 ghante se kam</div><div><b id="nExp">0</b>Khatam</div></div>
  <input id="q" placeholder="🔍 Naam ya code se dhoondo" oninput="render()">
  <div id="list"></div>
</div>
<div class="c">
  <h2>💾 Backup</h2>
  <p style="color:#9aa3ae;font-size:13px">Customers ki list isi phone mein hai. App data clear karne se pehle backup copy kar ke WhatsApp par khud ko bhej do.</p>
  <button class="s" onclick="cp(JSON.stringify(load()))">📋 Backup copy karo</button>
  <textarea id="rest" placeholder="Restore ke liye backup yahan paste karo"></textarea>
  <button class="s" onclick="restore()">♻️ Restore karo</button>
</div>
</div>
<script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const $=id=>document.getElementById(id);
function load(){ try{ return JSON.parse(localStorage.getItem('lg_clients')||'[]'); }catch(_){ return []; } }
function saveL(a){ try{ localStorage.setItem('lg_clients',JSON.stringify(a)); }catch(_){} }
async function gen(){
  const dev=$('dev').value.trim().toUpperCase(), name=$('name').value.trim()||'Bina naam';
  if(!/^[A-Z0-9]{8}$/.test(dev)){ $('msg').textContent='Device Code 8 harf ka hota hai.'; return; }
  const c=parseInt($('custom').value), days=c>0?c:parseInt($('pkg').value);
  const now=Math.floor(Date.now()/1000), e=now+days*86400;
  const p=b64u(new TextEncoder().encode(JSON.stringify({d:dev,e,p:days})));
  if(!window.Android || !Android.sign){ $('msg').textContent='Yeh sirf License Generator app mein chalta hai.'; return; }
  const sig=Android.sign(p); if(!sig){ $('msg').textContent='Key nahi bani — dobara try karo.'; return; }
  const key=p+'.'+sig;
  $('out').value=key;
  $('msg').textContent='✅ '+name+' — '+days+' din ki key ban gayi. Khatam: '+new Date(e*1000).toLocaleString('en-PK');
  const a=load(); a.unshift({name,dev,days,c:now,e,key}); saveL(a); render();
}
function left(e){
  const s=e-Date.now()/1000; if(s<=0) return null;
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d>0? d+' din '+h+' ghante' : (h>0? h+' ghante '+m+' min' : m+' min');
}
function render(){
  const a=load(), q=($('q').value||'').trim().toUpperCase();
  let act=0,soon=0,ex=0;
  // har device ka sirf naya record gino
  const seen={}; a.forEach(r=>{ if(seen[r.dev]) return; seen[r.dev]=1; const s=r.e-Date.now()/1000; if(s<=0) ex++; else if(s<86400){soon++;act++;} else act++; });
  $('nAct').textContent=act; $('nSoon').textContent=soon; $('nExp').textContent=ex;
  const rows=a.map((r,i)=>({r,i})).filter(x=>!q || x.r.name.toUpperCase().includes(q) || x.r.dev.includes(q))
    .sort((x,y)=>{ const lx=x.r.e-Date.now()/1000, ly=y.r.e-Date.now()/1000; if((lx>0)!==(ly>0)) return lx>0?-1:1; return lx>0? lx-ly : y.r.e-x.r.e; });
  $('list').innerHTML = rows.length? rows.map(({r,i})=>{
    const l=left(r.e), s=r.e-Date.now()/1000;
    const st = !l ? '<span class="bad">Khatam</span>' : (s<86400? '<span class="soon">'+l+' baqi</span>' : '<span class="ok">'+l+' baqi</span>');
    return '<div class="cl"><div class="t"><span class="n">'+esc(r.name)+'</span>'+st+'</div>'+
      '<div class="m">📱 '+r.dev+' · '+r.days+' din · Shuru: '+new Date(r.c*1000).toLocaleDateString('en-PK')+' · Khatam: '+new Date(r.e*1000).toLocaleString('en-PK')+'</div>'+
      '<button class="s" onclick="cp(load()['+i+'].key)">📋 Key</button>'+
      '<button class="s" onclick="renew('+i+')">🔄 Renew</button>'+
      '<button class="s" onclick="del('+i+')">🗑️</button></div>';
  }).join('') : '<p style="color:#9aa3ae;font-size:13px">Abhi koi customer nahi.</p>';
}
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renew(i){ const r=load()[i]; $('name').value=r.name; $('dev').value=r.dev; window.scrollTo(0,0); $('msg').textContent='Package chuno aur Key banao dabao.'; }
let delArm=-1;
function del(i){ if(delArm!==i){ delArm=i; $('msg').textContent='Delete karne ke liye 🗑️ dobara dabao.'; return; } const a=load(); a.splice(i,1); saveL(a); delArm=-1; $('msg').textContent='Delete ho gaya.'; render(); }
function cp(v){ if(!v) return; if(window.Android){ Android.copy(v); $('msg').textContent='Copy ho gaya ✅'; return; } try{ navigator.clipboard.writeText(v).then(()=>$('msg').textContent='Copy ho gaya ✅'); }catch(_){} }
function restore(){ try{ const a=JSON.parse($('rest').value); if(!Array.isArray(a)) throw 0; const cur=load(); const keys=new Set(cur.map(r=>r.key)); a.forEach(r=>{ if(r&&r.key&&!keys.has(r.key)) cur.push(r); }); saveL(cur); $('rest').value=''; $('msg').textContent='Restore ho gaya ✅'; render(); }catch(_){ $('msg').textContent='Backup ghalat hai.'; } }
render(); setInterval(render,60000);
</script></body></html>
